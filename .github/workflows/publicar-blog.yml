# Publica os posts do blog que chegaram na data (todo dia de manhã) e
# regenera o blog quando _fonte/blog muda no main.
name: Publicar blog

on:
  schedule:
    - cron: '0 9 * * *'   # 06h00 em Brasília
  push:
    branches: [main]
    paths:
      - '_fonte/blog/**'
      - 'blog/assets/**'
      - '.github/workflows/publicar-blog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-blog
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar o blog
        run: python _fonte/blog/gerar.py

      - name: Publicar se algo mudou
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nada novo."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Blog: posts publicados em $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          git pull --rebase origin main
          git push origin HEAD:main
